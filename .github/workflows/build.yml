name: rCore 2026f grading

on:
  push:
    branches: [ch3, ch4, ch5, ch6, ch8]
  workflow_dispatch:

permissions:
  contents: read

env:
  OSCAMP_COURSE_ID: '2073'
  CARGO_TERM_COLOR: never
  TZ: Asia/Shanghai

jobs:
  basic-test:
    name: Test chapter and reports
    if: >-
      !startsWith(github.event.repository.name, 'preparing-') &&
      contains(fromJSON('["ch3","ch4","ch5","ch6","ch8"]'), github.ref_name) &&
      (github.repository == '2026f-autotest/2026f-rcore' || vars.STUDENT_GITHUB != '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: alicesama/rcore-ci:2024a
    outputs:
      points: ${{ steps.grade.outputs.points }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run official rCore checker
        id: grade
        run: python3 -u .github/scripts/rcore_grade.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcore-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/rcore-grade.log
            tmp/rcore-result.json
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Save progress and upload score
    needs: basic-test
    # The template only tests. Each student repository has a maintainer-set login.
    if: >-
      !startsWith(github.event.repository.name, 'preparing-') &&
      github.repository_owner == '2026f-autotest' &&
      vars.STUDENT_GITHUB != '' &&
      github.actor == vars.STUDENT_GITHUB
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: opencamp-course-2073-report
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Save passed chapter and upload cumulative score
        env:
          ARCEOS_2026_SPRING_TOKEN: ${{ secrets.ARCEOS_2026_SPRING_TOKEN }}
          STUDENT_GITHUB: ${{ vars.STUDENT_GITHUB }}
          GRADE_POINTS: ${{ needs.basic-test.outputs.points }}
        run: python3 -u .github/scripts/rcore_publish.py
